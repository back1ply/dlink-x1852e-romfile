[project]
name = "dlink-x1852e-romfile"
version = "0.1.0"
description = "Decrypt, inspect and re-pack D-Link DSL-X1852E (EG) romfile.cfg config backups"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "back1ply" }]
keywords = ["d-link", "dsl-x1852e", "romfile", "trendchip", "airoha", "firmware", "reverse-engineering"]
classifiers = [
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = []

# Runtime system dependency: `openssl` must be on PATH (used for the AES primitive).

[project.scripts]
romfile = "dlink_romfile.cli:main"

[project.urls]
Homepage = "https://github.com/back1ply/dlink-x1852e-romfile"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dlink_romfile"
module-root = "src"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
exclude-newer = "2026-11-17T00:00:00Z"
